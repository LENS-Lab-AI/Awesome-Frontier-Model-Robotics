name: Submit a resource
description: Share a title and link — we'll handle the formatting.
title: "[Submission]: "
body:
  - type: markdown
    attributes:
      value: "Thanks for contributing! Just a title and link are enough. Authors are welcome to submit their own work."
  - type: input
    id: resource-title
    attributes:
      label: Resource title
      placeholder: Paper, report, benchmark, tool, or demo
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Link
      placeholder: https://...
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Section (optional)
      options:
        - Robot-Control Evaluations
        - Embodied Perception and Reasoning
        - Coding Agents and Tool Use
        - Safety and Reliability
        - Benchmarks and Resources
        - Not sure
  - type: textarea
    id: notes
    attributes:
      label: Anything else? (optional)
      description: Authors, code, or a quick note — only if you'd like to add it.
